deploy:
  stage: build-and-push
  # image: amazon/aws-cli:latest
  image: python:3.9
  script:
    - pip install awscli
    - aws ecs update-service --cluster viking-ui --service viking-ui --force-new-deployment --no-cli-pager
  needs:
    - build_and_push
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $AWS_ACCESS_KEY_ID && $AWS_SECRET_ACCESS_KEY && $DOCKER_USERNAME && $DOCKER_PASSWORD'
      when: always


stages:
  - build-and-push

build_and_push:
  stage: build-and-push
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    # Always build and push latest for any branch to Docker Hub
    - docker build -t "$DOCKER_USERNAME/svelte_ui:latest" .
    - docker push "$DOCKER_USERNAME/svelte_ui:latest"
    # If on main, also push stable and a timestamped version
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "$DOCKER_USERNAME/svelte_ui:latest" "$DOCKER_USERNAME/svelte_ui:stable"
        docker push "$DOCKER_USERNAME/svelte_ui:stable"
        VERSION_TAG="$(date +'%Y%m%d_%H%M')"
        docker tag "$DOCKER_USERNAME/svelte_ui:latest" "$DOCKER_USERNAME/svelte_ui:$VERSION_TAG"
        docker push "$DOCKER_USERNAME/svelte_ui:$VERSION_TAG"
      fi
  rules:
    # Always run if Docker Hub credentials are set (on any push, merge, or web edit)
    - if: $DOCKER_USERNAME && $DOCKER_PASSWORD
      when: always

# Ensure you set the following CI/CD variables in your GitLab project:
# - DOCKER_USERNAME: Your Docker Hub username
# - DOCKER_PASSWORD: Your Docker Hub password or access token
