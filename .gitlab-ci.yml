stages:
  - build
  # - deploy
  - refresh

variables:
  AWS_REGION: us-east-1
  ASG_NAME: "L2_TERRAFORM"  # Configure this in GitLab CI/CD variables

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    # Always build and push latest for any branch to Docker Hub
    - docker build -t "$DOCKER_USERNAME/svelte_ui:latest" .
    - docker push "$DOCKER_USERNAME/svelte_ui:latest"
    # If on main, also push stable and a timestamped version
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "$DOCKER_USERNAME/svelte_ui:latest" "$DOCKER_USERNAME/svelte_ui:stable"
        docker push "$DOCKER_USERNAME/svelte_ui:stable"
        VERSION_TAG="$(date +'%Y%m%d_%H%M')"
        docker tag "$DOCKER_USERNAME/svelte_ui:latest" "$DOCKER_USERNAME/svelte_ui:$VERSION_TAG"
        docker push "$DOCKER_USERNAME/svelte_ui:$VERSION_TAG"
      fi
  rules:
    # Always run if Docker Hub credentials are set (on any push, merge, or web edit)
    - if: $DOCKER_USERNAME && $DOCKER_PASSWORD
      when: always

