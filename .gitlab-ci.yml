# .gitlab-ci.yml for svelte_ui
# This pipeline builds the Docker image and pushes it to Docker Hub only

stages:
  - build-and-push

build_and_push:
  stage: build-and-push
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    # Always build and push latest for any branch to Docker Hub
    - docker build -t "$DOCKERHUB_USERNAME/svelte_ui:latest" .
    - docker push "$DOCKERHUB_USERNAME/svelte_ui:latest"
    # If on main, also push stable and a timestamped version
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "$DOCKERHUB_USERNAME/svelte_ui:latest" "$DOCKERHUB_USERNAME/svelte_ui:stable"
        docker push "$DOCKERHUB_USERNAME/svelte_ui:stable"
        VERSION_TAG="$(date +'%Y%m%d_%H%M')"
        docker tag "$DOCKERHUB_USERNAME/svelte_ui:latest" "$DOCKERHUB_USERNAME/svelte_ui:$VERSION_TAG"
        docker push "$DOCKERHUB_USERNAME/svelte_ui:$VERSION_TAG"
      fi
  rules:
    - if: $DOCKERHUB_USERNAME && $DOCKERHUB_PASSWORD
      when: always

# Ensure you set the following CI/CD variables in your GitLab project:
# - DOCKERHUB_USERNAME: Your Docker Hub username
# - DOCKERHUB_PASSWORD: Your Docker Hub password or access token
