# Manual job to refresh ASG instances (only on main branch)
refresh_asg_instances:
  stage: refresh
  image: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest
  needs:
    - build
  script:
    - echo "Starting ASG instance refresh for $ASG_NAME..."
    - |
      aws autoscaling start-instance-refresh \
        --auto-scaling-group-name "$ASG_NAME" \
        --region "$AWS_REGION" \
        --preferences '{"MinHealthyPercentage": 90, "InstanceWarmup": 60}' \
        --no-cli-pager
    - echo "Instance refresh initiated successfully!"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $AWS_ACCESS_KEY_ID && $AWS_SECRET_ACCESS_KEY'
      when: manual
  allow_failure: true
