# .gitlab-ci.yml for svelte_ui
# This pipeline builds the Docker image and pushes it to Docker Hub

stages:
  - build
  - push

variables:
  # Set your Docker image name (e.g., username/repo)
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE"
  # Optionally override with your Docker Hub repo (e.g., myuser/svelte_ui)
  # DOCKER_IMAGE: "myuser/svelte_ui"

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t "$DOCKER_IMAGE:latest" .
  rules:
    - if: '$CI_COMMIT_BRANCH'
      when: always

push:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    # Always push latest for any branch
    - docker tag "$DOCKER_IMAGE:latest" "$DOCKERHUB_USERNAME/svelte_ui:latest"
    - docker push "$DOCKERHUB_USERNAME/svelte_ui:latest"
    # If on main, also push stable and a timestamped version
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "$DOCKER_IMAGE:latest" "$DOCKERHUB_USERNAME/svelte_ui:stable"
        docker push "$DOCKERHUB_USERNAME/svelte_ui:stable"
        # Create a timestamp tag like svelte_ui:2026219_0952
        VERSION_TAG="$(date +'%Y%m%d_%H%M')"
        docker tag "$DOCKER_IMAGE:latest" "$DOCKERHUB_USERNAME/svelte_ui:$VERSION_TAG"
        docker push "$DOCKERHUB_USERNAME/svelte_ui:$VERSION_TAG"
      fi
  dependencies:
    - build
  rules:
    - if: $DOCKERHUB_USERNAME && $DOCKERHUB_PASSWORD
      when: always

# Ensure you set the following CI/CD variables in your GitLab project:
# - DOCKERHUB_USERNAME: Your Docker Hub username
# - DOCKERHUB_PASSWORD: Your Docker Hub password or access token
